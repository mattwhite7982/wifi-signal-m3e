name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack wifi-signal-m3e.zip
        run: unzip -o wifi-signal-m3e.zip -x ".github/*"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-signal-m3e-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
